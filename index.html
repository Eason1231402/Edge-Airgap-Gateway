<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. 物理安全中控台</title>
    <style>
        body {
            background-color: #0d1117;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 5px;
            border-bottom: 2px solid #00ff41;
            padding-bottom: 10px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .panel {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.1);
        }
        .panel h2 {
            margin-top: 0;
            font-size: 1.2em;
            color: #58a6ff;
            border-bottom: 1px dashed #30363d;
            padding-bottom: 10px;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            font-size: 1.1em;
        }
        .status-value {
            font-weight: bold;
        }
        .online { color: #00ff41; }
        .severed { color: #ff4444; animation: blink 1s infinite; }
        
        @keyframes blink {
            50% { opacity: 0.5; }
        }

        .log-box {
            background-color: #000;
            color: #00ff41;
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #30363d;
            font-size: 0.9em;
        }
        .log-entry { margin-bottom: 5px; }
        .log-time { color: #8b949e; margin-right: 10px; }
    </style>
</head>
<body>

    <h1>J.A.R.V.I.S. 边缘计算安全总控</h1>

    <div class="grid-container">
        <!-- 核心物理安全面板 -->
        <div class="panel">
            <h2>[ 核心物理安全链路 ]</h2>
            <div class="status-item">
                <span>外网通信模块 (Wi-Fi):</span>
                <span id="wifi-status" class="status-value online">ONLINE</span>
            </div>
            <div class="status-item">
                <span>物理熔断继电器:</span>
                <span id="relay-status" class="status-value online">闭合 (供电中)</span>
            </div>
            <div class="status-item">
                <span>边缘计算核心 (NLP):</span>
                <span class="status-value online">ACTIVE (离线就绪)</span>
            </div>
        </div>

        <!-- 终端设备面板 -->
        <div class="panel">
            <h2>[ 终端设备状态 ]</h2>
            <div class="status-item">
                <span>智能主灯:</span>
                <span id="light-status" class="status-value">OFF</span>
            </div>
            <!-- 窗帘已移除，保持极简 -->
        </div>
    </div>

    <!-- 实时日志面板 -->
    <div class="panel" style="margin-top: 20px;">
        <h2>[ 实时操作审计日志 ]</h2>
        <div class="log-box" id="log-box">
            <!-- 日志将通过 JS 动态插入 -->
        </div>
    </div>

    <script>
        // 每秒向树莓派后端请求一次最新状态
        setInterval(() => {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    // 更新 Wi-Fi 和 熔断器状态
                    const wifiEl = document.getElementById('wifi-status');
                    const relayEl = document.getElementById('relay-status');
                    if (data.wifi_relay === 'SEVERED') {
                        wifiEl.textContent = 'SEVERED (物理切断)';
                        wifiEl.className = 'status-value severed';
                        relayEl.textContent = '断开 (零供电)';
                        relayEl.className = 'status-value severed';
                    } else {
                        wifiEl.textContent = 'ONLINE';
                        wifiEl.className = 'status-value online';
                        relayEl.textContent = '闭合 (供电中)';
                        relayEl.className = 'status-value online';
                    }

                    // 更新设备状态
                    document.getElementById('light-status').textContent = data.light;

                    // 更新日志
                    const logBox = document.getElementById('log-box');
                    logBox.innerHTML = '';
                    data.logs.forEach(log => {
                        const div = document.createElement('div');
                        div.className = 'log-entry';
                        div.innerHTML = `<span class="log-time">[${log.time}]</span> ${log.msg}`;
                        logBox.appendChild(div);
                    });
                });
        }, 1000);
    </script>
</body>
</html>
